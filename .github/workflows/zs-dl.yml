name: ZS Download (MovieBox ke Abyss)

# Cara kerja: runner GitHub HANYA orkestrator (jaringan runner diblokir
# CDN MovieBox 426 — teruji). Unduhan nyata dilakukan DI DALAM Codespace
# mb-relay (jaringan Azure yang diterima CDN — teruji 206) lewat endpoint
# /exec milik relay.py: cari judul → unduh dari CDN → upload ke Abyss →
# register ke situs. Setelah selesai Codespace DIMATIKAN lagi agar kuota
# 60 jam/bulan tidak terbakar.

on:
  workflow_dispatch:
    inputs:
      judul:
        description: "Judul/kata kunci pencarian — ATAU URL detail MovieBox (moviesDetail/…, Task 99: lompat pencarian utk judul yang tak terindeks)"
        required: true
      sumber:
        description: "Sumber unduhan (Task 96 + 97)"
        required: false
        default: "moviebox"
        type: choice
        options:
          - moviebox
          - lk21
          - manual
      link:
        description: "[manual] Link file final — BOLEH BANYAK (pisah newline/spasi/koma): Cast/Vikingfile/Mega/Google Share dari portal LK21. Film/1 episode = dicoba berurutan sampai ada yang berhasil; series = jumlah baris harus = jumlah episode (baris n → episode n)"
        required: false
        default: ""
      tipe:
        description: "[manual] movie / tv (bentuk nama file + register episode)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - movie
          - tv
      pilihan:
        description: "Indeks hasil pencarian kalau ada beberapa (default 0)"
        required: false
        default: "0"
      musim:
        description: "Musim ke berapa (SERIAL saja; film biarkan 1)"
        required: false
        default: "1"
      episode:
        description: "Episode ke berapa (SERIAL saja; film biarkan 1)"
        required: false
        default: "1"
      episodes:
        description: "BULK series: daftar/rentang episode, mis. 1-100 / 1,3,5-8 (kosong = mode tunggal input episode). Di-chunk otomatis ±2 jam per run"
        required: false
        default: ""
      budget_menit:
        description: "Soft-budget menit per chunk bulk (default 95; kecil = chunk pendek utk tes)"
        required: false
        default: "95"
      kualitas:
        description: "auto / 1080 / 720 / 360 (default auto = tertinggi gratis)"
        required: false
        default: "auto"
      subtitle:
        description: "in_id / ms / en / none (default in_id)"
        required: false
        default: "in_id"
      token:
        description: "TOKEN dari Admin → Server 3 (opsional; isi agar otomatis register ke situs)"
        required: false
        default: ""
      slug_lama:
        description: "Slug Abyss run sebelumnya, mis. SGZKkyR9C (opsional; isi = register-saja TANPA unduh/upload ulang)"
        required: false
        default: ""

concurrency:
  group: zs-dl
  cancel-in-progress: false

jobs:
  unduh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    # Task 92: actions:write → runner bisa men-dispatch chunk berikutnya
    # via GITHUB_TOKEN (fallback bila CODES_PAT gagal); contents:read utk checkout
    permissions:
      actions: write
      contents: read
    env:
      CODES_PAT: ${{ secrets.CODES_PAT }}
      ZS_EXEC_KEY: ${{ secrets.ZS_EXEC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Susun parameter (JSON)
        env:
          I_JUDUL: ${{ inputs.judul }}
          I_SUMBER: ${{ inputs.sumber }}
          I_LINK: ${{ inputs.link }}
          I_TIPE: ${{ inputs.tipe }}
          I_PICK: ${{ inputs.pilihan }}
          I_MUSIM: ${{ inputs.musim }}
          I_EPISODE: ${{ inputs.episode }}
          I_EPISODES: ${{ inputs.episodes }}
          I_BUDGET: ${{ inputs.budget_menit }}
          I_KUALITAS: ${{ inputs.kualitas }}
          I_SUBTITLE: ${{ inputs.subtitle }}
          I_TOKEN: ${{ inputs.token }}
          I_SLUG_LAMA: ${{ inputs.slug_lama }}
          ABYSS_KEY: ${{ secrets.ABYSS_KEY }}
          ABYSS_EMAIL: ${{ secrets.ABYSS_EMAIL }}
          ABYSS_PASSWORD: ${{ secrets.ABYSS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          p = {
              "title": os.environ["I_JUDUL"],
              "source": (os.environ["I_SUMBER"] or "moviebox").strip(),
              "link": os.environ["I_LINK"] or "",
              "tipe": os.environ["I_TIPE"] or "",
              "pick": int(os.environ["I_PICK"] or 0),
              "se": int(os.environ["I_MUSIM"] or 1),
              "ep": int(os.environ["I_EPISODE"] or 1),
              "episodes": os.environ["I_EPISODES"] or "",
              "budget_min": int(os.environ["I_BUDGET"] or 0) or 95,
              "quality": os.environ["I_KUALITAS"] or "auto",
              "sub": os.environ["I_SUBTITLE"] or "in_id",
              "token": os.environ["I_TOKEN"] or "",
              "reuse_slug": os.environ["I_SLUG_LAMA"] or "",
              "abyss_key": os.environ["ABYSS_KEY"],
              "abyss_email": os.environ["ABYSS_EMAIL"],
              "abyss_password": os.environ["ABYSS_PASSWORD"],
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "zs-params.json")
          with open(path, "w") as f:
              json.dump(p, f)
          mode = f"BULK {p['episodes']}" if p["episodes"] else f"tunggal S{p['se']}E{p['ep']}"
          print(f"params siap — sumber: {p['source']} | judul: {p['title']} | mode: {mode} | kualitas: {p['quality']}")
          PY

      - name: Cari Codespace relay mb-relay
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          PAT = os.environ["CODES_PAT"]
          req = urllib.request.Request(
              "https://api.github.com/user/codespaces?per_page=25",
              headers={"Authorization": f"Bearer {PAT}",
                       "Accept": "application/vnd.github+json"})
          data = json.load(urllib.request.urlopen(req, timeout=60))
          cs = [c for c in data.get("codespaces", [])
                if c.get("repository", {}).get("full_name") ==
                "fauziramadha/mb-relay" and c.get("state") != "Deleted"]
          if not cs:
              raise SystemExit("Codespace mb-relay tidak ditemukan — buat "
                               "dari repo (Code → Codespaces → Create).")
          c0 = sorted(cs, key=lambda c: c.get("last_used_at") or "",
                      reverse=True)[0]
          print("codespace:", c0["name"], "| state:", c0["state"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CS_NAME={c0['name']}\n")
              f.write(f"CS_STATE={c0['state']}\n")
              f.write(f"RELAY_URL=https://{c0['name']}-8080.app.github.dev\n")
          PY

      - name: Bangunkan Codespace + tunggu relay hidup
        run: |
          if [ "$CS_STATE" != "Available" ]; then
            echo "codespace state: $CS_STATE → memulai…"
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer $CODES_PAT" \
              "https://api.github.com/user/codespaces/$CS_NAME/start" || true
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request
          PAT = os.environ["CODES_PAT"]; NAME = os.environ["CS_NAME"]
          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": f"Bearer {PAT}",
                           "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          deadline = time.time() + 420
          state = "?"
          last_start = 0.0
          while time.time() < deadline:
              try:
                  state = api(f"/user/codespaces/{NAME}")["state"]
              except Exception:
                  pass
              if state == "Available":
                  break
              # POST /start ulang tiap 60 dtk bila masih mati/bertransisi —
              # menutup race: POST pertama (bash, || true) bisa ditelan saat
              # codespace masih ShuttingDown → tanpa ini start tak pernah
              # terjadi dan polling menunggu 7 menit sia-sia (kasus nyata
              # run 9 Okt: state stuck Shutting→Shutdown 7 menit).
              if state in ("Shutdown", "ShuttingDown") and \
                      time.time() - last_start > 60:
                  try:
                      req = urllib.request.Request(
                          "https://api.github.com/user/codespaces/"
                          + NAME + "/start", method="POST",
                          headers={"Authorization": f"Bearer {PAT}",
                                   "Accept": "application/vnd.github+json"})
                      urllib.request.urlopen(req, timeout=30).read()
                  except Exception:
                      pass
                  last_start = time.time()
                  print("  → POST /start ulang (race shutdown)", flush=True)
              print("  codespace state:", state, flush=True)
              time.sleep(10)
          if state != "Available":
              raise SystemExit(f"Codespace belum Available setelah 7 menit "
                               f"(state: {state}) — coba lagi nanti.")
          print("codespace Available ✔")
          base = f"https://{NAME}-8080.app.github.dev"
          ok = False
          relay_deadline = time.time() + 360  # jendela sendiri: port public
          while time.time() < relay_deadline:  # + relay start (self-healing)
              try:
                  r = urllib.request.urlopen(base + "/healthz", timeout=15)
                  if r.read() == b"ok":
                      ok = True
                      break
              except Exception:
                  pass
              print("  tunggu relay port public (self-healing)…", flush=True)
              time.sleep(10)
          if not ok:
              raise SystemExit("Relay tidak menjawab /healthz — port masih "
                               "private? Cek public_port.sh di codespace.")
          print("relay hidup ✔  →", base)
          PY

      - name: Jalankan pipeline DI DALAM Codespace (via relay /exec)
        id: monitor
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.request

          BASE = os.environ["RELAY_URL"]
          KEY = os.environ["ZS_EXEC_KEY"]

          def post(path, obj):
              req = urllib.request.Request(
                  BASE + path, data=json.dumps(obj).encode(), method="POST",
                  headers={"Content-Type": "application/json",
                           "X-ZS-Key": KEY})
              with urllib.request.urlopen(req, timeout=130) as r:
                  return json.loads(r.read() or b"{}")

          def get(path):
              req = urllib.request.Request(BASE + path,
                                           headers={"X-ZS-Key": KEY})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          # 1. kirim parameter (base64 agar aman dari quoting shell)
          params = open(os.environ["RUNNER_TEMP"] +
                        "/zs-params.json", "rb").read()
          b64 = base64.b64encode(params).decode()
          r = post("/exec", {"cmd":
                  f"echo {b64} | base64 -d > /tmp/zs-params.json && echo OK"})
          print("kirim params:", r.get("code"), r.get("out", "")[:40])
          assert "OK" in r.get("out", ""), f"gagal kirim params: {r}"

          # 1b. sinkronkan kode terbaru ke codespace (non-fatal).
          #     Saat codespace dibangunkan, postStartCommand sudah menarik
          #     git pull otomatis; langkah ini menutup celah saat codespace
          #     SUDAH hidup sebelum workflow jalan (pull start tidak terpicu)
          #     — agar perbaikan zs_dl.py terbaru selalu terpakai.
          r = post("/exec", {"cmd":
                  "cd /workspaces/mb-relay && "
                  "(git pull --ff-only 2>&1 | tail -n 1; echo SYNC) || "
                  "echo SYNC-SKIP"})
          out1b = (r.get("out") or "").strip().splitlines()
          print("sync kode:", r.get("code"),
                out1b[-1] if out1b else "(tanpa jawaban)")

          # 2. mulai pekerjaan panjang di codespace
          cmd = ("cd /workspaces/mb-relay && "
                 "python3 zs_dl.py /tmp/zs-params.json")
          r = post("/jobstart", {"cmd": cmd})
          print("pekerjaan dimulai:", r)
          assert r.get("started"), f"jobstart gagal: {r}"

          # 3. pantau log sampai selesai (maks 2,5 jam — Task 96c: upload
          #    Abyss kini rotasi-endpoint, file besar butuh ruang); log
          #    penuh ditampung untuk deteksi marker sisa episode bulk (Task 92)
          off, deadline, exit_code = 0, time.time() + 9000, None
          full_log = ""
          while time.time() < deadline:
              j = get(f"/joblog?from={off}")
              if j.get("size", 0) > off:
                  chunk = base64.b64decode(j.get("b64", "")) \
                      .decode("utf-8", "replace")
                  print(chunk, end="", flush=True)
                  full_log += chunk
                  off = j["size"]
              if j.get("done") and not j.get("alive"):
                  exit_code = j.get("exit")
                  break
              time.sleep(10)
          if exit_code is None:
              raise SystemExit("pekerjaan tidak selesai dalam 2,5 jam / "
                               "log terputus")
          print(f"\n== exit code codespace: {exit_code} ==")

          # 3b. Task 92 — sisa episode bulk → step output utk antre-chunk
          remain = ""
          m = re.search(r"ZS_BULK_REMAIN:([0-9,\-]+)", full_log)
          if m:
              remain = m.group(1)
          # Task 98 — sisa LINK pasangan manual (b64 JSON list)
          linkremain = ""
          m2 = re.search(r"ZS_LINK_REMAIN:([A-Za-z0-9+/=]+)", full_log)
          if m2:
              linkremain = m2.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"remain={remain}\n")
              f.write(f"linkremain={linkremain}\n")
          print(f"== sisa episode chunk berikutnya: {remain or '(tidak ada)'} =="
                + (f" (+{len(linkremain)} b64 link)" if linkremain else ""))

          if exit_code != 0:
              raise SystemExit(f"pipeline gagal di codespace (exit {exit_code})")
          print("PIPELINE SELESAI ✔")
          PY

      - name: Antre chunk berikutnya bila ada sisa episode (bulk)
        # Task 92 — dispatch ulang workflow ini dengan sisa spec episode.
        # CODES_PAT (PAT user) utama; GITHUB_TOKEN (actions:write) fallback.
        if: steps.monitor.outputs.remain != ''
        env:
          REMAIN: ${{ steps.monitor.outputs.remain }}
          LINK_REMAIN: ${{ steps.monitor.outputs.linkremain }}
          I_JUDUL: ${{ inputs.judul }}
          I_SUMBER: ${{ inputs.sumber }}
          I_TIPE: ${{ inputs.tipe }}
          I_PICK: ${{ inputs.pilihan }}
          I_MUSIM: ${{ inputs.musim }}
          I_BUDGET: ${{ inputs.budget_menit }}
          I_KUALITAS: ${{ inputs.kualitas }}
          I_SUBTITLE: ${{ inputs.subtitle }}
          I_TOKEN: ${{ inputs.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error

          REPO = "fauziramadha/mb-relay"
          # Task 98: chunk manual multi-link bawa sisa LINK pasangannya
          links_sisa = ""
          if os.environ.get("LINK_REMAIN"):
              try:
                  links_sisa = "\n".join(json.loads(
                      base64.b64decode(os.environ["LINK_REMAIN"])))
              except Exception:
                  links_sisa = ""
          inputs = {
              "judul": os.environ["I_JUDUL"],
              "sumber": os.environ["I_SUMBER"] or "moviebox",
              "link": links_sisa,
              "tipe": (os.environ["I_TIPE"] or "") if links_sisa else "",
              "pilihan": os.environ["I_PICK"] or "0",
              "musim": os.environ["I_MUSIM"] or "1",
              "episode": "1",
              "episodes": os.environ["REMAIN"],
              "budget_menit": os.environ["I_BUDGET"] or "95",
              "kualitas": os.environ["I_KUALITAS"] or "auto",
              "subtitle": os.environ["I_SUBTITLE"] or "in_id",
              "token": os.environ["I_TOKEN"] or "",
              "slug_lama": "",
          }
          body = json.dumps({"ref": "main", "inputs": inputs}).encode()

          def dispatch(token, label):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/"
                  "zs-dl.yml/dispatches",
                  data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=30)
                  return True
              except urllib.error.HTTPError as e:
                  print(f"  dispatch via {label}: HTTP {e.code} "
                        f"{e.read()[:150]}")
                  return False

          ok = False
          pat = os.environ.get("CODES_PAT")
          if pat:
              ok = dispatch(pat, "CODES_PAT")
          if not ok and os.environ.get("GITHUB_TOKEN"):
              ok = dispatch(os.environ["GITHUB_TOKEN"], "GITHUB_TOKEN")
          if ok:
              print("OK: chunk berikutnya DIANTREKAN — sisa episode: "
                    + os.environ["REMAIN"])
          else:
              print("!! gagal auto-antre chunk berikutnya — jalankan MANUAL:")
              print("   GitHub > fauziramadha/mb-relay > Actions > "
                    "ZS Download > Run workflow dengan input:")
              for k, v in inputs.items():
                  print(f"     {k} = {v}")
          PY

      - name: Matikan Codespace lagi (hemat kuota)
        # dilewati bila masih ada sisa episode bulk — codespace dibiarkan
        # hidup supaya chunk berikutnya langsung jalan tanpa boot ulang
        if: always() && steps.monitor.outputs.remain == ''
        run: |
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer $CODES_PAT" \
            "https://api.github.com/user/codespaces/$CS_NAME/stop" || true
          echo "codespace dimatikan ✔"
